<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070b1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SET PIECE — the daily free kick</title>
  <meta name="description" content="Five free kicks a day. Swipe to draw the ball's path around the wall and past the keeper. Same five kicks for everyone." />
  <meta property="og:title" content="SET PIECE — the daily free kick" />
  <meta property="og:description" content="Five free kicks a day. Swipe to bend it round the wall. Same five kicks for everyone." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://andrewshooman.github.io/talisman/setpiece/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root { --gold: #ffc940; --ink: #070b1a; --card: rgba(10, 14, 32, 0.88); --line: rgba(255,255,255,0.12); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      display: flex; align-items: center; gap: 10px; pointer-events: none;
      background: linear-gradient(rgba(7,11,26,0.85), rgba(7,11,26,0)); }
    #hud > * { pointer-events: auto; }
    #pips { display: flex; gap: 4px; font-size: 20px; min-height: 26px; }
    .pip { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
      display: grid; place-items: center; font-size: 15px; line-height: 1; }
    .pip.now { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,201,64,0.6); }
    .pip.done { border-color: transparent; font-size: 20px; }
    #info { flex: 1; text-align: center; font-size: 13px; white-space: nowrap; opacity: 0.85; font-variant-numeric: tabular-nums; }
    #score { font-weight: 800; font-size: 18px; color: var(--gold); min-width: 54px; text-align: right;
      font-variant-numeric: tabular-nums; }
    .icon { background: rgba(255,255,255,0.1); border: 0; color: #fff; width: 34px; height: 34px;
      border-radius: 50%; font-size: 16px; }
    #banner { position: fixed; left: 0; right: 0; top: 17%; text-align: center; pointer-events: none;
      opacity: 0; transform: scale(0.7); transition: opacity 0.18s, transform 0.25s cubic-bezier(.2,1.6,.4,1); }
    #banner.on { opacity: 1; transform: scale(1); }
    #bmain { font-size: clamp(34px, 11vw, 64px); font-weight: 900; letter-spacing: 1px; font-style: italic;
      text-shadow: 0 4px 0 rgba(0,0,0,0.45), 0 0 30px rgba(0,0,0,0.6); }
    #banner.good #bmain { color: var(--gold); }
    #bsub { font-size: 20px; font-weight: 800; margin-top: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
    #hint { position: fixed; left: 0; right: 0; top: calc(56px + env(safe-area-inset-top)); text-align: center;
      font-size: 14px; opacity: 0.9; pointer-events: none; text-shadow: 0 1px 4px #000; padding: 0 16px; }
    .card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 380px);
      background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px;
      text-align: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6); max-height: 92vh; overflow-y: auto; }
    .hidden { display: none !important; }
    .logo { font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: 2px; line-height: 1;
      background: linear-gradient(180deg, #fff, var(--gold)); -webkit-background-clip: text; background-clip: text;
      color: transparent; }
    .tag { font-size: 14px; opacity: 0.8; margin: 6px 0 16px; }
    .btn { display: block; width: 100%; padding: 15px; margin-top: 10px; border-radius: 14px; border: 0;
      font-size: 17px; font-weight: 800; color: #fff; background: rgba(255,255,255,0.12); cursor: pointer; }
    .btn.primary { background: linear-gradient(180deg, #ffd766, #f5a800); color: #1a1200; }
    .btn:active { transform: scale(0.98); }
    .how { text-align: left; font-size: 14px; line-height: 1.5; opacity: 0.9; margin: 14px 4px 4px; padding-left: 18px; }
    .row { font-size: 38px; letter-spacing: 4px; margin: 10px 0 6px; }
    .big { font-size: 22px; font-weight: 800; }
    .muted { font-size: 13px; opacity: 0.7; margin-top: 8px; }
    .muted a { color: #fff; }
    .stats { display: flex; justify-content: space-around; margin: 12px 0 2px; }
    .stats b { display: block; font-size: 20px; color: var(--gold); }
    .stats span { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <button class="icon" id="home" aria-label="Menu">☰</button>
    <div id="pips"></div>
    <div id="info"></div>
    <div id="score">0</div>
    <button class="icon" id="mute" aria-label="Sound">🔊</button>
  </div>

  <div id="banner"><div id="bmain"></div><div id="bsub"></div></div>
  <div id="hint" class="hidden"></div>

  <div id="menu" class="card">
    <div class="logo">SET PIECE</div>
    <div class="tag">The daily free kick. Same five for everyone.</div>
    <button class="btn primary" id="playDaily">Play today's five</button>
    <button class="btn" id="playPractice">Practice</button>
    <ol class="how">
      <li><b>Swipe from the ball</b> to where you want it to go.</li>
      <li><b>Curve your swipe</b> to bend it round the wall.</li>
      <li><b>Swipe faster</b> to hit it harder. Harder is less accurate.</li>
    </ol>
    <div class="muted" id="menuStreak"></div>
  </div>

  <div id="result" class="card hidden">
    <div class="muted" id="resTitle"></div>
    <div class="row" id="resRow"></div>
    <div class="big" id="resLine"></div>
    <div class="stats">
      <div><b id="stStreak">0</b><span>day streak</span></div>
      <div><b id="stBest">0</b><span>best streak</span></div>
      <div><b id="stTop">0</b><span>best score</span></div>
    </div>
    <button class="btn primary" id="share">Share result</button>
    <button class="btn" id="resPractice">Practice</button>
    <div class="muted" id="shareMsg"></div>
    <div class="muted" id="nextIn"></div>
    <div class="muted"><a id="feedback" target="_blank" rel="noopener"
      href="https://github.com/andrewshooman/talisman/issues/new?title=Feedback%3A%20&labels=feedback">Tell us what you think</a></div>
  </div>

  <script src="core.js?v=0.1.0"></script>
  <script src="game.js?v=0.1.0"></script>
</body>
</html>
